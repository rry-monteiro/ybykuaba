[project]
name = "ybykuaba"
version = "0.1.0"
description = "Um menu para busca de apps, arquivos, executar comandos e calculos"
readme = "README.md"
authors = [
    { name = "Raimundo", email = "ray.yh.yh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pywebview[qt]>=6.2.1",
]

[project.scripts]
ybykuaba = "ybykuaba:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
